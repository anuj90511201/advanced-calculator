<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5fb">
  <title>Orbit — Advanced Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Orbit calculator home"><span class="brand-mark">◉</span><span>orbit<span class="brand-muted">.calc</span></span></a>
      <div class="topbar-actions">
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Toggle theme">☾</button>
        <a class="github-link" href="README.md">About <span aria-hidden="true">↗</span></a>
      </div>
    </header>

    <section class="workspace" aria-label="Calculator workspace">
      <section class="calculator card" aria-label="Calculator">
        <div class="calculator-heading">
          <div><p class="eyebrow">PRECISION, IN ORBIT</p><h1>Calculator</h1></div>
          <div class="angle-switch" role="group" aria-label="Angle unit">
            <button type="button" class="angle-option active" data-angle="DEG" aria-pressed="true">DEG</button>
            <button type="button" class="angle-option" data-angle="RAD" aria-pressed="false">RAD</button>
          </div>
        </div>

        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="expression" id="expression-display">Ready when you are</div>
          <div class="result-row"><span class="result-equals">=</span><output id="result-display">0</output></div>
          <div class="display-message" id="display-message" role="status"></div>
        </div>

        <div class="memory-row" aria-label="Memory controls">
          <span class="memory-label">MEMORY</span>
          <button type="button" data-action="memory-clear">MC</button><button type="button" data-action="memory-recall">MR</button>
          <button type="button" data-action="memory-add">M+</button><button type="button" data-action="memory-subtract">M−</button>
          <button type="button" data-action="memory-store">MS</button>
          <span class="memory-indicator" id="memory-indicator" title="Memory is empty"></span>
        </div>

        <div class="keypad" aria-label="Calculator keys">
          <button class="key utility" data-insert="(" aria-label="Open parenthesis">(</button><button class="key utility" data-insert=")" aria-label="Close parenthesis">)</button><button class="key utility" data-insert="%">%</button><button class="key clear" data-action="clear">AC</button><button class="key delete" data-action="backspace" aria-label="Delete last character">⌫</button>

          <button class="key function" data-insert="sin(">sin</button><button class="key function" data-insert="cos(">cos</button><button class="key function" data-insert="tan(">tan</button><button class="key function" data-insert="sqrt(">√</button><button class="key operator" data-insert="÷">÷</button>
          <button class="key function" data-insert="log(">log</button><button class="key function" data-insert="ln(">ln</button><button class="key function" data-insert="^2">x²</button><button class="key function" data-insert="^">xʸ</button><button class="key operator" data-insert="×">×</button>
          <button class="key number" data-insert="7">7</button><button class="key number" data-insert="8">8</button><button class="key number" data-insert="9">9</button><button class="key function" data-insert="!">n!</button><button class="key operator" data-insert="−">−</button>
          <button class="key number" data-insert="4">4</button><button class="key number" data-insert="5">5</button><button class="key number" data-insert="6">6</button><button class="key function" data-insert="π">π</button><button class="key operator" data-insert="+">+</button>
          <button class="key number" data-insert="1">1</button><button class="key number" data-insert="2">2</button><button class="key number" data-insert="3">3</button><button class="key function" data-insert="e">e</button><button class="key operator" data-insert="÷">÷</button>
          <button class="key number" data-insert="0">0</button><button class="key number" data-insert=".">.</button><button class="key utility" data-insert="Ans">Ans</button><button class="key equals" data-action="calculate">=</button>
        </div>
        <p class="keyboard-hint"><span class="keyboard-icon">⌨</span> Type on your keyboard <kbd>Enter</kbd> to calculate <kbd>Esc</kbd> to clear</p>
      </section>

      <aside class="history card" aria-label="Calculation history">
        <div class="history-heading"><div><p class="eyebrow">YOUR RECENT WORK</p><h2>History</h2></div><button class="text-button" id="clear-history" type="button">Clear all</button></div>
        <div class="history-list" id="history-list"><div class="empty-history"><span class="history-orbit">↻</span><strong>No calculations yet</strong><span>Your results will appear here.</span></div></div>
        <div class="history-footer"><span class="history-dot"></span> Saved in this session</div>
      </aside>
    </section>
    <footer class="page-footer"><span>ORBIT CALCULATOR</span><span>Built for clear thinking <span class="footer-star">✳</span></span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
